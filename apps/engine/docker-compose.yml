services:
  engine:
    build:
      context: ../..
      dockerfile: apps/engine/Dockerfile
    restart: always
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
