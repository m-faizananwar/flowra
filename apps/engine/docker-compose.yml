services:
  engine:
    build:
      context: ../..
      dockerfile: apps/engine/Dockerfile
    restart: always
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
    env_file:
      - .env
    healthcheck:
      # node is guaranteed present in the image; wget/curl are NOT in node:*-slim
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
