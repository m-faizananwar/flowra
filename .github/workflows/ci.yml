name: CI

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, staging, production]

env:
  PNPM_VERSION: 10.32.1
  NODE_VERSION: 22

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter @flowra/web lint
        name: Lint
        continue-on-error: true
      - run: pnpm --filter @flowra/web build
        name: Build

  engine:
    name: Engine (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter @flowra/engine build
        name: Build (tsc)
      - run: pnpm --filter @flowra/engine test
        name: Unit tests
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    # Engine image only — the web frontend is built & deployed by Vercel,
    # so the VPS deploy must not be gated on the web build.
    needs: [engine]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        working-directory: apps/engine

  deploy:
    name: Deploy Engine (VPS)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/flowra
            git pull origin production
            sudo docker compose -f apps/engine/docker-compose.yml build
            sudo docker compose -f apps/engine/docker-compose.yml down
            sudo docker compose -f apps/engine/docker-compose.yml up -d
            sudo docker image prune -f
